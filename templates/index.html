<!DOCTYPE html>
<html lang="en">
<head>
  <title>Glioma Detection - Login</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/he/1.2.0/he.js" integrity="sha512-o4gKX6jcK0rdciOZ9X8COYkV9gviTJAbYEVW8aC3OgIRuaKDmcT9/OFXBVzHSSOxiTjsTktqrUvCUrHkQHSn9Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
  .container{
      padding-left: 25%;
      padding-right: 25%;
  }
    #home, #form1, #form2, #form3, #form4{
      display: none;
        margin: auto;
        padding: 50px;
        background-color: rgba(0, 0, 0, 0.50);
        color: white;
    }
    #home.active, #form1.active, #form2.active, #form3.active, #form4.active{
        display: block;
    }
        .color-white{
            color:#ffffff !important;
        }
h2{
  text-transform: uppercase;
}
  </style>
</head>
 <body style="background-image: url('static/demo1.jpg');background-size: 100% 100vh; background-repeat: no-repeat;">
 <center>

<nav class="navbar navbar-inverse">
  <div class="container-fluid">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" data-value="#form1" onclick="toggleform(event)">GLIOMA DETECTION</a>
    </div>
    <div class="collapse navbar-collapse" id="myNavbar">
      <ul class="nav navbar-nav">
        <li ><a data-value="#form1" onclick="toggleform(event)"><span class="glyphicon glyphicon-home"></span>Home</a></li>
      </ul>
      <ul class="nav navbar-nav navbar-right">
        <li><a data-value="#form1" onclick="toggleform(event)"><span class="glyphicon glyphicon-user"></span> User</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="justify-content:center">
<div class="container">
  {% if msg %}
<div class="alert alert-warning alert-dismissible">
  <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>
  <strong>Warning!</strong> {{msg}}
</div>
{% endif %}
    <form  method="post" action="{{ url_for('userlog')}}" id="form1" class="active">
      <h2 class=color-white>User Login</h2>
      <hr>
      <div class="form-group">
        <label for="username">Username:</label>
        <div style="display: flex; align-items: center;">
          <input type="text" class="form-control" id="username" placeholder="Enter username or use voice" name="name" required style="flex: 1;">
          <button type="button" onclick="startVoiceInput('username')" style="margin-left: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
            🎤
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <div style="display: flex; align-items: center;">
          <input type="password" class="form-control" id="password" placeholder="Enter password or use voice" name="password" required style="flex: 1;">
          <button type="button" onclick="startVoiceInput('password')" style="margin-left: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
            🎤
          </button>
        </div>
      </div>
      <div id="voiceStatus" style="color: #ffeb3b; text-align: center; margin: 10px 0; font-weight: bold;"></div>
      <button type="submit" class="btn btn-default">Submit</button></br></br>
      <p>Click here to <a data-value="#form2" onclick="toggleform(event)">Sign up</a></p>
    </form>


    <form method="post" action="{{ url_for('userreg')}}" id="form2">
      <h2>User Registration</h2>
      <hr>
      <div class="form-group">
        <label for="reg_username">Username:</label>
        <div style="display: flex; align-items: center;">
          <input type="text" class="form-control" id="reg_username" placeholder="Enter username or use voice" name="name" required style="flex: 1;">
          <button type="button" onclick="startVoiceInput('reg_username')" style="margin-left: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
            🎤
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <div style="display: flex; align-items: center;">
          <input type="email" class="form-control" id="email" placeholder="Enter email or use voice" name="email" required style="flex: 1;">
          <button type="button" onclick="startVoiceInput('email')" style="margin-left: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
            🎤
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="phone">Mobile No.:</label>
        <div style="display: flex; align-items: center;">
          <input type="tel" class="form-control" id="phone" placeholder="Enter mobile number or use voice" name="phone" required style="flex: 1;">
          <button type="button" onclick="startVoiceInput('phone')" style="margin-left: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
            🎤
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="reg_password">Password:</label>
        <div style="display: flex; align-items: center;">
          <input type="password" class="form-control" id="reg_password" placeholder="Enter password or use voice" name="password" required style="flex: 1;">
          <button type="button" onclick="startVoiceInput('reg_password')" style="margin-left: 10px; padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
            🎤
          </button>
        </div>
      </div>
      <div id="voiceStatusReg" style="color: #ffeb3b; text-align: center; margin: 10px 0; font-weight: bold;"></div>
      <button type="submit" class="btn btn-default">Submit</button></br></br>
      <p>Click here to <a data-value="#form1" onclick="toggleform(event)">Sign in</a></p>
    </form>

</div>
</section>
</center>
<script>
    let recognition = null;
    let currentField = null;
    let isListening = false;

    // Initialize speech recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
    }

    function toggleform(e) {
        var Id =(e.target.getAttribute('data-value'))
        let Items= ['#form1', '#form2'];
        Items.map(function(item) {
            if(Id === item ) {
                $(item).addClass("active");
            }
            else {
            $(item).removeClass("active");
            }
        })
    }

    function startVoiceInput(fieldId) {
        if (!recognition) {
            alert('Speech recognition not supported in this browser');
            return;
        }

        if (isListening) {
            stopVoiceInput();
            return;
        }

        currentField = fieldId;
        isListening = true;

        // Update status
        const statusElement = fieldId.includes('reg_') ?
            document.getElementById('voiceStatusReg') :
            document.getElementById('voiceStatus');

        statusElement.textContent = `🎤 Please speak your ${getFieldName(fieldId)}...`;

        // Update button
        const button = event.target;
        button.textContent = '🛑';
        button.style.background = '#f44336';

        recognition.start();

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript.trim();

            // Fill the field
            document.getElementById(currentField).value = transcript;

            statusElement.textContent = `✅ Captured: "${transcript}"`;

            stopVoiceInput();
        };

        recognition.onerror = function(event) {
            statusElement.textContent = '❌ Error: ' + event.error;
            stopVoiceInput();
        };

        recognition.onend = function() {
            if (isListening) {
                statusElement.textContent = '🔄 Processing...';
            }
            stopVoiceInput();
        };
    }

    function stopVoiceInput() {
        isListening = false;

        if (recognition) {
            recognition.stop();
        }

        // Reset all voice buttons
        const buttons = document.querySelectorAll('button[onclick*="startVoiceInput"]');
        buttons.forEach(button => {
            button.textContent = '🎤';
            button.style.background = '#4CAF50';
        });
    }

    function getFieldName(fieldId) {
        switch(fieldId) {
            case 'username':
            case 'reg_username':
                return 'username';
            case 'password':
            case 'reg_password':
                return 'password';
            case 'email':
                return 'email address';
            case 'phone':
                return 'phone number';
            default:
                return 'input';
        }
    }

    // Add voice prompts
    function speakPrompt(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 0.8;
            speechSynthesis.speak(utterance);
        }
    }

    // Auto-prompt when page loads
    window.addEventListener('load', function() {
        setTimeout(() => {
            speakPrompt('Welcome to Glioma Detection System. Please enter your username and password. You can use voice input by clicking the microphone buttons.');
        }, 1000);
    });

</script>

</body>
</html>
